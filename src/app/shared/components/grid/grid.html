<div class="flex flex-col h-[80vh] md:h-[70vh] md:w-full mx-1 border border-gray-300 shadow-2xl rounded-xl bg-white overflow-hidden">
  
  @if (withSearch()) {
    <div class="px-4 py-3 border-b border-gray-200 bg-gray-50 flex flex-col md:flex-row gap-2 items-center">
      <div class="relative flex-1 w-full md:w-auto">
        <input #searchField
               type="text" 
               [placeholder]="placeholder()"
               (input)="handleSearch($event)"
               (keyup.enter)="triggerSearch()"
               class="w-full text-[9px] md:text-sm xl:text-md 2xl:text-lg p-2 pr-10 bg-white rounded-lg shadow-sm 
                      transition-all duration-300 border border-transparent
                      outline-none hover:border-gray-300 focus:border-poke-blue focus:shadow-md">
        
        @if (searchTerm()) {
          <button (click)="clearSearch()" 
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-poke-red-alt font-bold">
            ✕
          </button>
        }
      </div>

      @if (withSearchButton()) {
        <button (click)="triggerSearch()"
                class="px-4 py-3 bg-poke-blue w-full md:w-auto text-white rounded-lg hover:bg-blue-700 transition-colors font-pokemon text-xs shadow-md">
           {{ labelSearchButton() }}
        </button>
      }
    </div>
  }

  <div #scrollContainer class="flex-1 overflow-y-auto p-4 md:p-6">
    @if (items().length > 0) {
      <div class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6">
        @for (item of items(); track $index) {
          <div class="animate-fade-in lg:max-w-[250px] w-full mx-auto">
            <ng-container 
              [ngTemplateOutlet]="itemTemplate" 
              [ngTemplateOutletContext]="{ $implicit: item }">
            </ng-container>
          </div>
        }
      </div>
    } @else {
      <div class="flex h-full flex-col items-center justify-center text-gray-400 italic gap-2">
        <span class="text-center mb-4">{{noResultsFoundLabel()}}</span>
        <button (click)="clearSearch()" class="text-xs text-poke-blue underline not-italic">{{ labelViewAll }}</button>
      </div>
    }
  </div>

  @if (withPagination()) {
    <div class="p-4 border-t border-gray-200 bg-gray-50 flex flex-col md:flex-row md:justify-between md:items-center gap-3">
      
      <span class="w-full text-center text-sm font-semibold text-poke-blue md:w-auto md:text-left">
        {{ labelResults }}: {{ items().length }}
      </span>

       <div class="flex justify-between w-full md:w-auto">
        <button (click)="onPageChange.emit('prev')" 
                [disabled]="disabledValuePrevButton()"
                class="px-4 py-2 bg-white text-poke-red-alt border border-gray-200 font-pokemon rounded-lg hover:bg-poke-red shadow-sm hover:text-white transition-colors disabled:opacity-50">
          {{ labelPrev }}
        </button>

        <button (click)="onPageChange.emit('next')" 
                [disabled]="disabledValueNextButton()"
                class="px-4 py-2 bg-white text-poke-red-alt border border-gray-200 font-pokemon rounded-lg hover:bg-poke-red shadow-sm hover:text-white transition-colors disabled:opacity-50">
          {{ labelNext }}
        </button>
      </div>

    </div>
  }
</div>
