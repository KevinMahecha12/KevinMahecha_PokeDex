<app-pokemon-type-filter #typeFilter (onTypeChange)="handleTypeFilter($event)" />

@if (showSpinner()) {
  <div class="fixed inset-0 z-[200] flex flex-col items-center justify-center bg-black/50 backdrop-blur-md animate-fade-in">
    
    <div style="display: flex; justify-content: center; margin-bottom: 24px;">
      <div class="pokeball-spinner"></div>  
    </div>
    
    <p class="font-pokemon text-white text-2xl animate-pulse tracking-widest uppercase">
      {{ _pokemonService.language() === 'es' ? 'Cargando...' : 'Loading...' }}
    </p>
  </div>
}

<app-grid 
    [items]="loading() ? skeletonItems : pagedPokemon()" 
    [withSearch]="true" 
    [withSearchButton]="true"
    [labelSearchButton]="searchButtonLabel()"
    [noResultsFoundLabel]="noResultsFoundLabel()"
    [labelPrev]="gridLabels().prev"
    [labelNext]="gridLabels().next"
    [labelResults]="gridLabels().results"
    [labelViewAll]="gridLabels().viewAll"
    [placeholder]="placeholderLabel()"
    [labelSearchButton]="searchButtonLabel()"
    [withPagination]="true"
    [placeholder]="placeholderLabel()"
    (onSearch)="handleFilter($event)"
    (onSearchClick)="handleGlobalSearch($event)"
    (onClear)="resetToNormalList()"
    (onPageChange)="changePage($event)"
    [disabledValueNextButton]="isLastPage() || loading() || backupList().length > 0"
    [disabledValuePrevButton]="isFirstPage() || loading() || backupList().length > 0"
>
    
    <ng-template #itemTemplate let-pokemon>
        @if (loading()) {
            <div class="bg-gray-200 border-2 border-gray-300 rounded-2xl shadow-sm overflow-hidden w-full h-48 animate-pulse">
                <div class="h-4 bg-gray-300 w-1/4 m-2 ml-auto rounded"></div>
                <div class="h-24 bg-gray-300 mx-4 rounded-lg mt-2"></div>
                <div class="h-6 bg-gray-300 mx-8 mt-4 rounded"></div>
            </div>
        } 
        @else {
            @defer (on viewport) {
                <app-pokemon-card 
                    [pokemonData]="pokemon" 
                    (click)="openModal(pokemon)"
                    class="cursor-pointer"
                />
            } @placeholder {
                <div class="h-48 w-full bg-gray-400 animate-pulse rounded-2xl"></div>
            }
        }
    </ng-template>

</app-grid>

@if (selectedPokemon()) {
    <app-pokemon-detail-modal 
      [pokemon]="selectedPokemon()!" 
      (close)="selectedPokemon.set(null)"
    />
}
