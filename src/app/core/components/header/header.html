<header class="font-pokemon bg-poke-red p-2 md:p-4 shadow-lg">
  <div class="flex justify-between items-center max-w-7xl mx-auto px-4">
    
    <img src="assets/images/pokemonLogo.svg" alt="Pokemon Logo" class="h-10 lg:h-14">
    
    <h1 class="font-pokemon text-white text-center text-sm md:text-2xl lg:text-4xl drop-shadow-md flex-1 px-4">
        Kevin Mahecha ¡Pokédex!
    </h1>

    <div class="flex items-center">
      <button 
        (click)="toggleLanguage()" 
        class="relative flex items-center justify-center w-10 h-10 md:w-12 md:h-12 bg-white rounded-full border-4 border-poke-blue shadow-xl hover:scale-110 active:scale-95 transition-all overflow-hidden cursor-pointer"
        [title]="pokemonService.language() === 'es' ? 'Switch to English' : 'Cambiar a Español'">
        
        <img 
          [src]="pokemonService.language() === 'es' ? 'https://flagcdn.com/mx.svg' : 'https://flagcdn.com/us.svg'" 
          class="w-full h-full object-cover"
          [alt]="pokemonService.language()">
          
        <div class="absolute top-1 left-1 w-3 h-3 bg-white/40 rounded-full"></div>
      </button>
    </div>

  </div>
</header>
